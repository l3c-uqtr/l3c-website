# Configuration du site L3C.
# Les fichiers ci-dessous restent sur l'ordinateur : ils ne sont JAMAIS copiés dans le dépôt GitHub.
# Seuls les champs listés dans scripts/build_data.R sont exportés vers le site.
# Les chemins sont relatifs au dossier du projet (0-QuantifiedSelf/02_Websites/l3c-website).

sources:
  cvdata: "../../CVdata.xlsx"
  publications: "../../01_CV/MyPublications/myarticles.bib"
  conferences: "../../01_CV/MyPublications/confs.bib"

# Afficher le montant des subventions sur la page Projets ?
afficher_montants: false

# Corrections d'affichage, sans modifier CVdata : "Nom, Prénom dans le fichier": "Nom, Prénom à afficher"
corrections_noms:
  "Jacob, Martin": "Martin, Jacob"

# Afficher la page Cours dans le site ? (false : la page est retirée du menu, de la recherche et du plan du site)
afficher_cours: false

# Traduction des champs field/spe des .bib en mots-clés affichés (la casse est ignorée) : [français, anglais].
# Mettre ~ pour ne pas afficher un mot-clé. Un mot absent de cette liste est affiché tel quel.
mots_cles:
  Neuropsy: [Neuropsychologie, Neuropsychology]
  Neuopsy: [Neuropsychologie, Neuropsychology]
  Npsy: [Neuropsychologie, Neuropsychology]
  Neuro: [Neuropsychologie, Neuropsychology]
