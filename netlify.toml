# Le site est compilé sur l'ordinateur (Mettre_a_jour_le_site.bat) :
# Netlify publie simplement le dossier docs/ à chaque envoi sur GitHub.
[build]
  publish = "docs"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Le lien CV du menu télécharge le fichier au lieu de l'ouvrir
[[headers]]
  for = "/files/GVallet_CV.pdf"
  [headers.values]
    Content-Disposition = "attachment; filename=\"GVallet_CV.pdf\""
